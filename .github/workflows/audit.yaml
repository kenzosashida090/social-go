name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
  
    - name: Set up GO
      uses: actions/setup-go@v6
      with:
        go-version: '^1.26.2'

    - name: Verify dependencies
      run: go mod verify

    - name: BUild
      run: go build -v ./...

    - name: Run go vet
      run: go vet ./... 

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run:  staticcheck ./...

    - name: Run Tests
      run: go test -race ./...
